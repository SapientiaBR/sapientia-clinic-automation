<!-- @dsCard group="Spacing" viewport="700x210" name="Espaçamento em uso" subtitle="Card 20px de padding, grid com gap 24, respiro generoso" -->
<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:22px;background:var(--surface-page);font:var(--type-body)}.r{display:flex;gap:10px;align-items:center}.c{display:flex;flex-direction:column}</style>
</head><body><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-6)">
<div style="background:var(--surface-card);border-radius:var(--radius-xl);box-shadow:var(--shadow-sm);padding:var(--card-pad);display:flex;flex-direction:column;gap:10px">
<span style="font:var(--type-label);color:var(--text-secondary)">Conversas atendidas</span>
<span style="font:var(--weight-bold) 36px/1 var(--font-display);letter-spacing:var(--tracking-heading)">1.284</span>
<span style="font:var(--type-caption);font-size:13px;color:var(--text-muted)">+12% vs. semana passada</span></div><div style="background:var(--surface-card);border-radius:var(--radius-xl);box-shadow:var(--shadow-sm);padding:var(--card-pad);display:flex;flex-direction:column;gap:10px">
<span style="font:var(--type-label);color:var(--text-secondary)">Consultas confirmadas</span>
<span style="font:var(--weight-bold) 36px/1 var(--font-display);letter-spacing:var(--tracking-heading)">312</span>
<span style="font:var(--type-caption);font-size:13px;color:var(--text-muted)">98% pela secretária</span></div><div style="background:var(--surface-card);border-radius:var(--radius-xl);box-shadow:var(--shadow-sm);padding:var(--card-pad);display:flex;flex-direction:column;gap:10px">
<span style="font:var(--type-label);color:var(--text-secondary)">Tempo de resposta</span>
<span style="font:var(--weight-bold) 36px/1 var(--font-display);letter-spacing:var(--tracking-heading)">11s</span>
<span style="font:var(--type-caption);font-size:13px;color:var(--text-muted)">média nas 24h</span></div>
</div></body></html>
