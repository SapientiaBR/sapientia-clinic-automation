<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:22px;background:var(--surface-page);font:var(--type-body)}.r{display:flex;gap:10px;align-items:center}.c{display:flex;flex-direction:column}</style>
</head><body><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;height:116px">
<div style="background:var(--si-ghost);border:1px solid var(--border-subtle);border-radius:var(--radius-xl);display:grid;place-items:center"><img src="../assets/logo-si-mark.png" style="height:52px"></div>
<div style="background:var(--si-mint);border-radius:var(--radius-xl);display:grid;place-items:center"><img src="../assets/logo-si-mark.png" style="height:52px"></div>
<div style="background:var(--si-emerald-700);border-radius:var(--radius-xl);display:grid;place-items:center"><span style="width:66px;height:66px;border-radius:50%;background:#fff;display:grid;place-items:center"><img src="../assets/logo-si-mark.png" style="height:52px"></span></div>
<div style="background:var(--gradient-ink);border-radius:var(--radius-xl);display:grid;place-items:center"><span style="width:66px;height:66px;border-radius:50%;background:#fff;display:grid;place-items:center"><img src="../assets/logo-si-mark.png" style="height:52px"></span></div>
</div></body></html>
