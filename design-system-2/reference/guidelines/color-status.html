<!-- @dsCard group="Colors" viewport="700x170" name="Status" subtitle="Confirmado, pendente, cancelado, remarcado — com seus tints" -->
<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:22px;background:var(--surface-page);font:var(--type-body)}.r{display:flex;gap:10px;align-items:center}.c{display:flex;flex-direction:column}</style>
</head><body><div class="r" style="gap:14px;align-items:stretch">
<div class="c" style="flex:1;gap:6px">
<div style="height:44px;border-radius:var(--radius-md);background:var(--si-status-good)"></div>
<div style="height:32px;border-radius:var(--radius-md);background:var(--si-tint-good)"></div>
<span style="display:inline-flex;align-items:center;gap:6px;font:var(--type-label)"><span style="width:7px;height:7px;border-radius:50%;background:var(--si-status-good)"></span>Confirmado</span>
</div><div class="c" style="flex:1;gap:6px">
<div style="height:44px;border-radius:var(--radius-md);background:var(--si-status-warn)"></div>
<div style="height:32px;border-radius:var(--radius-md);background:var(--si-tint-warn)"></div>
<span style="display:inline-flex;align-items:center;gap:6px;font:var(--type-label)"><span style="width:7px;height:7px;border-radius:50%;background:var(--si-status-warn)"></span>Pendente</span>
</div><div class="c" style="flex:1;gap:6px">
<div style="height:44px;border-radius:var(--radius-md);background:var(--si-status-alert)"></div>
<div style="height:32px;border-radius:var(--radius-md);background:var(--si-tint-alert)"></div>
<span style="display:inline-flex;align-items:center;gap:6px;font:var(--type-label)"><span style="width:7px;height:7px;border-radius:50%;background:var(--si-status-alert)"></span>Cancelado</span>
</div><div class="c" style="flex:1;gap:6px">
<div style="height:44px;border-radius:var(--radius-md);background:var(--si-status-info)"></div>
<div style="height:32px;border-radius:var(--radius-md);background:var(--si-tint-info)"></div>
<span style="display:inline-flex;align-items:center;gap:6px;font:var(--type-label)"><span style="width:7px;height:7px;border-radius:50%;background:var(--si-status-info)"></span>Remarcado</span>
</div>
</div></body></html>
