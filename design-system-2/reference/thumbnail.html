<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><title>Secretária Invisível</title><link rel="stylesheet" href="styles.css">
<style>html,body{margin:0;width:1280px;height:854px;overflow:hidden}.wrap{display:grid;grid-template-columns:1fr 200px;width:1280px;height:854px}.main{background:var(--si-emerald-700);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:48px}.mark{width:300px;height:300px;border-radius:50%;background:#fff;display:grid;place-items:center}.mark img{width:236px;height:236px;display:block}.name{font:var(--weight-medium) 82px/1 var(--font-display);letter-spacing:-0.03em;color:#EAF6F1;white-space:nowrap}.strip{display:grid;grid-template-rows:repeat(4,1fr)}</style>
</head><body>
<div class="wrap">
<div class="main"><span class="mark"><img src="assets/logo-si-mark.png" alt=""></span><span class="name">Secretária Invisível</span></div>
<div class="strip"><div style="background:#DBF9F1"></div><div style="background:#1BBFBA"></div><div style="background:#21806A"></div><div style="background:#003D2F"></div></div>
</div>
</body></html>
