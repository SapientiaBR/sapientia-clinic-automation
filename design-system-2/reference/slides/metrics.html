<!-- @dsCard group="Slides" viewport="1280x720" name="Métricas" subtitle="Quatro números grandes sobre fundo claro" -->
<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><title>Métricas</title><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0;width:1280px;height:720px;overflow:hidden}.slide{width:1280px;height:720px;position:relative;overflow:hidden;display:flex;flex-direction:column}
.pad{padding:72px 80px}.eyebrow{display:flex;gap:12px;font:var(--type-label);font-size:16px;letter-spacing:var(--tracking-eyebrow)}
.blob{position:absolute;background:#fff;pointer-events:none}
.foot{position:absolute;left:80px;right:80px;bottom:44px;display:flex;align-items:center;justify-content:space-between;font:var(--type-label);font-size:15px}
</style></head><body><div class="slide" style="background:var(--surface-page)">
<div class="pad" style="flex:1;display:flex;flex-direction:column;gap:56px">
<div style="display:flex;flex-direction:column;gap:16px">
<p class="eyebrow" style="color:var(--si-emerald-700)"><span>04</span><span style="opacity:.5">//</span><span>Resultados em 90 dias</span></p>
<h2 style="font:var(--weight-medium) 56px/1.08 var(--font-display);letter-spacing:-.03em;max-width:24ch">Medido no painel da própria clínica</h2>
</div>
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:24px">
<div style="background:var(--surface-card);border-radius:var(--radius-xl);box-shadow:var(--shadow-sm);padding:28px;display:flex;flex-direction:column;gap:14px">
<span style="font:var(--weight-bold) 52px/1 var(--font-display);letter-spacing:-.03em;color:var(--si-emerald-700)">11s</span>
<span style="font:var(--weight-medium) 17px/1.35 var(--font-sans)">tempo médio de resposta</span>
<span style="font:var(--weight-regular) 15px/1.4 var(--font-sans);color:var(--text-muted)">+ 24h por dia de cobertura</span></div><div style="background:var(--surface-card);border-radius:var(--radius-xl);box-shadow:var(--shadow-sm);padding:28px;display:flex;flex-direction:column;gap:14px">
<span style="font:var(--weight-bold) 52px/1 var(--font-display);letter-spacing:-.03em;color:var(--si-emerald-700)">82%</span>
<span style="font:var(--weight-medium) 17px/1.35 var(--font-sans)">confirmações sem intervenção</span>
<span style="font:var(--weight-regular) 15px/1.4 var(--font-sans);color:var(--text-muted)">antes: 34% manual</span></div><div style="background:var(--surface-card);border-radius:var(--radius-xl);box-shadow:var(--shadow-sm);padding:28px;display:flex;flex-direction:column;gap:14px">
<span style="font:var(--weight-bold) 52px/1 var(--font-display);letter-spacing:-.03em;color:var(--si-emerald-700)">4%</span>
<span style="font:var(--weight-medium) 17px/1.35 var(--font-sans)">de faltas</span>
<span style="font:var(--weight-regular) 15px/1.4 var(--font-sans);color:var(--text-muted)">antes: 17%</span></div><div style="background:var(--surface-card);border-radius:var(--radius-xl);box-shadow:var(--shadow-sm);padding:28px;display:flex;flex-direction:column;gap:14px">
<span style="font:var(--weight-bold) 52px/1 var(--font-display);letter-spacing:-.03em;color:var(--si-emerald-700)">R$ 27,6 mil</span>
<span style="font:var(--weight-medium) 17px/1.35 var(--font-sans)">receita recuperada por mês</span>
<span style="font:var(--weight-regular) 15px/1.4 var(--font-sans);color:var(--text-muted)">sobre ticket médio de R$ 600</span></div>
</div>
</div>
<div class="foot" style="color:var(--text-muted)"><span>Secretária Invisível</span><span>04 / 09</span></div>
</div></body></html>
