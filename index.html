<!DOCTYPE html>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <meta name="format-detection" content="telephone=no" />

    <!-- Título de reserva, para o caso de o pré-render não rodar. O build troca
         esta linha pelo título de cada rota (vite-plugin-prerender). Mantenha
         igual ao title da home em src/seo/site.ts. -->
    <title>Secretária virtual para clínicas | Secretária Invisível</title>
    <meta name="author" content="Sapient.IA" />

    <!-- title, description, canonical, robots, og:title, og:description,
         og:url, os twitter:* equivalentes e o JSON-LD sao emitidos por rota no
         Helmet (components/landing/Landing). Nao declare nada disso aqui: o
         Helmet nao substitui o que ja esta no HTML estatico, e a tag viraria
         duplicada. No build, vite-plugin-prerender grava as mesmas tags,
         marcadas com data-rh, em dist/<rota>/index.html; o cliente as troca
         ao montar. -->
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://secretariainvisivel.com.br/og-image.jpg?v=5" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Secretária Invisível: atendimento no WhatsApp da clínica" />
    <meta property="og:site_name" content="Secretária Invisível" />
    <meta property="og:locale" content="pt_BR" />

    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:image" content="https://secretariainvisivel.com.br/og-image.jpg?v=5" />

    <link rel="icon" type="image/png" sizes="16x16" href="/favicons/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="msapplication-TileColor" content="#ffffff" />
    <meta name="theme-color" content="#ffffff" />
